name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version, for example 0.1.0-preview.1'
        required: true
        type: string

permissions:
  contents: read

jobs:
  pack-and-publish:
    name: Pack and publish
    runs-on: ubuntu-latest

    env:
      PACKAGE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x

      - name: Normalize package version
        shell: bash
        run: |
          version="${PACKAGE_VERSION#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: $PACKAGE_VERSION" >&2
            exit 1
          fi

          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore ArrowNet.Compression.NativeCompressions.slnx

      - name: Build
        run: dotnet build ArrowNet.Compression.NativeCompressions.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/ArrowNet.Compression.NativeCompressions.Tests/ArrowNet.Compression.NativeCompressions.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack src/ArrowNet.Compression.NativeCompressions/ArrowNet.Compression.NativeCompressions.csproj -c Release --no-build -p:PackageVersion=$PACKAGE_VERSION -o ./nugetpkgs

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./nugetpkgs/*.nupkg
          if-no-files-found: error

      - name: Publish to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [[ -z "$NUGET_API_KEY" ]]; then
            echo "NUGET_API_KEY secret is required to publish." >&2
            exit 1
          fi

          dotnet nuget push "./nugetpkgs/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

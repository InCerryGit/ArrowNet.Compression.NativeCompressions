name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x

      - name: Restore
        run: dotnet restore Arrow.Compression.NativeCompressions.slnx

      - name: Build
        run: dotnet build Arrow.Compression.NativeCompressions.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/Arrow.Compression.NativeCompressions.Tests/Arrow.Compression.NativeCompressions.Tests.csproj -c Release --no-build
